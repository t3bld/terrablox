<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stack review</title>
    <style>
      /* System fonts and the host's own colour scheme. An MCP app sits inside somebody
         else's chat window, so it should read as part of it rather than announcing a brand
         — and `color-scheme` plus `prefers-color-scheme` is the whole of what is needed to
         follow a host into dark mode without a theme provider. */
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #18181b;
        --muted: #71717a;
        --line: #e4e4e7;
        --card: #fafafa;
        --code: #f4f4f5;
        --blocking: #b91c1c;
        --warning: #a16207;
        --ok: #15803d;
        --recurring: #d97706;
        --usage: #0284c7;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #18181b;
          --fg: #fafafa;
          --muted: #a1a1aa;
          --line: #3f3f46;
          --card: #212124;
          --code: #27272a;
          --blocking: #f87171;
          --warning: #fbbf24;
          --ok: #4ade80;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 12px;
        background: var(--bg);
        color: var(--fg);
        font:
          14px/1.5 ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      code,
      pre {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
      }
      .card {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        padding: 12px;
        margin-bottom: 10px;
      }
      .card h2 {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 8px;
        font-size: 13px;
        font-weight: 600;
      }
      .pill {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0 7px;
        font-size: 11px;
        color: var(--muted);
        font-weight: 500;
      }
      .muted {
        color: var(--muted);
        margin: 4px 0;
      }
      .ok {
        color: var(--ok);
        margin: 4px 0;
      }
      .problems,
      .types {
        list-style: none;
        margin: 8px 0 0;
        padding: 0;
      }
      .problems > li {
        border-left: 3px solid var(--line);
        padding: 6px 0 6px 10px;
        margin-bottom: 8px;
      }
      .problems > li.blocking {
        border-left-color: var(--blocking);
      }
      .problems > li.warning {
        border-left-color: var(--warning);
      }
      .problems p {
        margin: 4px 0 0;
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }
      .tag {
        border-radius: 4px;
        padding: 1px 6px;
        font-size: 10.5px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }
      .tag.blocking {
        background: var(--blocking);
        color: var(--bg);
      }
      .tag.warning {
        background: var(--warning);
        color: var(--bg);
      }
      /* Outlined rather than filled: it qualifies the finding beside it instead of
         competing with it for attention. */
      .tag.unverifiable {
        border: 1px solid var(--muted);
        color: var(--muted);
      }
      .tag.kind,
      .tag.version {
        background: var(--code);
        color: var(--muted);
        text-transform: none;
        font-weight: 500;
      }
      .row {
        border-top: 1px solid var(--line);
        padding: 8px 0;
      }
      .row:first-of-type {
        border-top: 0;
      }
      .row-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      .label {
        font-weight: 600;
      }
      .args {
        display: grid;
        grid-template-columns: minmax(0, auto) minmax(0, 1fr);
        gap: 2px 10px;
        margin: 6px 0 0;
      }
      .args dt {
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
      }
      .args dd {
        margin: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      .bucket {
        border-top: 1px solid var(--line);
        padding: 8px 0;
      }
      .bucket.recurring strong {
        color: var(--recurring);
      }
      .bucket.usage strong {
        color: var(--usage);
      }
      .types > li {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 6px;
        padding: 2px 0;
      }
      .driver {
        color: var(--muted);
        font-size: 11.5px;
        margin-left: auto;
      }
      pre {
        background: var(--code);
        border-radius: 6px;
        padding: 10px;
        overflow: auto;
        max-height: 320px;
        margin: 8px 0;
      }
      .copy {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--bg);
        color: var(--fg);
        padding: 4px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      .copy:hover {
        background: var(--code);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <p class="muted">Waiting for the host to send the stack.</p>
    </div>
    <script type="module">
      /* replaced at build time with the bundled app */
    </script>
  </body>
</html>
