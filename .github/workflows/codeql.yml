name: CodeQL

# Static analysis, weekly and on pull requests.
#
# `pnpm audit` answers "is a dependency known-vulnerable". This answers the other
# question — "did we write something exploitable" — which nothing in this repository
# was asking. CodeQL's JavaScript/TypeScript queries cover the classes that matter for
# an app like this: injection into generated code, unvalidated redirects, missing
# origin checks, unsafe URL handling.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Monday morning. A weekly run is what catches a newly published query pattern
    # against code that has not changed.
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      # Uploading results to the Security tab needs this; nothing else is granted.
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: github/codeql-action/init@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
        with:
          languages: javascript-typescript
          # `security-and-quality` over the default `security` set: the extra queries
          # are noisy on some codebases but this one is small enough for the signal to
          # be worth it.
          queries: security-and-quality

      # No build step. For JavaScript and TypeScript CodeQL analyses the source
      # directly, so installing dependencies would only slow the job down.
      - uses: github/codeql-action/analyze@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
        with:
          category: "/language:javascript-typescript"
