services:
  postgres:
    image: postgres:17-alpine
    container_name: terrablox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: terrablox
      POSTGRES_PASSWORD: terrablox
      POSTGRES_DB: terrablox
    ports:
      - "5433:5432"
    volumes:
      - terrablox-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrablox -d terrablox"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  terrablox-pgdata:
